name: IRAN-LLM corpus checks

on:
  pull_request:
    paths:
      - "iran-llm/**"
  push:
    branches:
      - "iran-llm-bootstrap"
    paths:
      - "iran-llm/**"

jobs:
  legal-corpus-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iran-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip jsonschema pytest
      - name: Validate Python syntax
        run: python -m compileall -q scripts tests
      - name: Run corpus validator tests
        run: python -m pytest -q tests

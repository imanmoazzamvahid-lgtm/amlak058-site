name: IRAN-LLM model CPU smoke test

on:
  push:
    branches:
      - iran-llm-bootstrap
    paths:
      - "iran-llm/model.py"
      - "iran-llm/scripts/smoke_test.py"
      - ".github/workflows/iran-llm-model-smoke.yml"
  pull_request:
    paths:
      - "iran-llm/model.py"
      - "iran-llm/scripts/smoke_test.py"
      - ".github/workflows/iran-llm-model-smoke.yml"

jobs:
  transformer-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iran-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile model code
        run: python -m py_compile model.py scripts/smoke_test.py
      - name: Run random-initialized Transformer smoke test
        run: python scripts/smoke_test.py

name: Store exact homepage image in repository
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copy-banner-to-assets.yml"
permissions:
  contents: write
jobs:
  copy-exact-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the user's original JPEG
        env:
          HERO_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/a19a6f0b-01a2-4f1e-925b-83fdc00483da.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDIzNDk1YTFiN2FmMDhjMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDM3NjYwOX0.t7chuh01tCtKeJBSim-pOiWT5pfJlvLj8rr5IZxQRgk"
          EXPECTED_SHA256: "010ae5172f7f3c212bb4f86c6977744e49afffc36673a34a3f1efb36e82bb78f"
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --retry-all-errors "$HERO_URL" -o assets/homepage-hero-058.jpg
          echo "$EXPECTED_SHA256  assets/homepage-hero-058.jpg" | sha256sum --check -
          file assets/homepage-hero-058.jpg
      - name: Point the site to the permanent local image
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old_url = "https://d2jqrm6oza8nb6.cloudfront.net/datasets/784bd4a5-4a58-41c7-bacd-aebba20f615d.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2E2Zjg1YzA3MGM2NjczZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDM2Mzk2OH0.6orpziJygAXdLXDfcCE92anIRg0ozuCaX16-LxIudsw"
          local_url = "/assets/homepage-hero-058.jpg?v=1"
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          palette = Path("palette.css")
          css = palette.read_text(encoding="utf-8")
          commission = Path("commission.html")
          commission_html = commission.read_text(encoding="utf-8")
          if old_url not in html:
              raise SystemExit("Previous temporary image URL missing from index.html")
          if old_url not in css:
              raise SystemExit("Previous temporary image URL missing from palette.css")
          html = html.replace(old_url, local_url)
          css = css.replace(old_url, local_url)
          html = html.replace("/palette.css?v=5", "/palette.css?v=6")
          commission_html = commission_html.replace("/palette.css?v=5", "/palette.css?v=6")
          preload = f'<link rel="preload" as="image" href="{local_url}" fetchpriority="high">'
          if "homepage-hero-058.jpg" not in html.split("</head>", 1)[0]:
              html = html.replace("</head>", preload + "\n</head>", 1)
          index.write_text(html, encoding="utf-8")
          palette.write_text(css, encoding="utf-8")
          commission.write_text(commission_html, encoding="utf-8")
          if old_url in html or old_url in css:
              raise SystemExit("Temporary URL was not fully removed")
          if local_url not in html or local_url not in css:
              raise SystemExit("Permanent local path was not written")
          PY
      - name: Commit permanent image and local references
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/homepage-hero-058.jpg index.html palette.css commission.html
          git commit -m "Store exact homepage hero image permanently in assets"
          git push origin HEAD:main

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#123d32"/><stop offset="1" stop-color="#071f1a"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g)"/><circle cx="900" cy="220" r="280" fill="#c8a96b" opacity=".12"/><path d="M0 1450L1080 1150V1920H0" fill="#f2ead9" opacity=".08"/><text x="90" y="170" fill="#d8bd7b" font-size="42" font-family="sans-serif">مرکز مشاورین املاک ایمان</text><text x="90" y="520" fill="#f4ead8" font-size="72" font-weight="bold" font-family="sans-serif">نبض بازار مسکن</text><text x="90" y="660" fill="#d8bd7b" font-size="46" font-family="sans-serif">پیش از خرید، بررسی کنید</text><foreignObject x="90" y="790" width="900" height="520"><div xmlns="http://www.w3.org/1999/xhtml" style="font:44px sans-serif;color:#f4ead8;line-height:1.9;text-align:right;direction:rtl">در خرید واحدهای پروژه‌ای، فقط به وعده تحویل اکتفا نکنید.<br/>پیشرفت واقعی پروژه، وضعیت مجوزها و تعهدات قراردادی را بررسی کنید.</div></foreignObject><text x="90" y="1710" fill="#d8bd7b" font-size="38" font-family="sans-serif">amlak058.ir  |  @amlakiman.1370</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#f2ead9"/><rect x="55" y="55" width="970" height="1810" rx="45" fill="#123d32"/><text x="100" y="190" fill="#d8bd7b" font-size="42" font-family="sans-serif">مرکز مشاورین املاک ایمان</text><text x="100" y="420" fill="#fff4df" font-size="78" font-weight="bold" font-family="sans-serif">رصد بازار</text><text x="100" y="540" fill="#d8bd7b" font-size="42" font-family="sans-serif">جمعه ۱۵ آبان ۱۴۰۵</text><foreignObject x="100" y="680" width="880" height="700"><div xmlns="http://www.w3.org/1999/xhtml" style="font:42px sans-serif;color:#fff4df;line-height:2;text-align:right;direction:rtl">دلار آزاد: نرخ لحظه‌ای را پیش از انتشار بررسی کنید.<br/>طلای ۱۸ عیار: نرخ هر گرم را با زمان ثبت درج کنید.<br/>سکه امامی: قیمت فروش و حباب را جداگانه بسنجید.</div></foreignObject><text x="100" y="1540" fill="#d8bd7b" font-size="38" font-family="sans-serif">نرخ‌ها متغیرند؛ مرجع و ساعت ثبت ضروری است.</text><text x="100" y="1740" fill="#fff4df" font-size="36" font-family="sans-serif">amlak058.ir  |  @amlakiman.1370</text></svg>
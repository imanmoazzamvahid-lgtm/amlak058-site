<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#123d32"/><path d="M0 0H1080V520Q540 700 0 520Z" fill="#c8a96b" opacity=".18"/><text x="90" y="170" fill="#d8bd7b" font-size="42" font-family="sans-serif">نکته حقوقی ملکی</text><text x="90" y="460" fill="#fff4df" font-size="74" font-weight="bold" font-family="sans-serif">قبل از بیعانه</text><foreignObject x="90" y="610" width="900" height="850"><div xmlns="http://www.w3.org/1999/xhtml" style="font:48px sans-serif;color:#fff4df;line-height:2;text-align:right;direction:rtl">۱. مالکیت و هویت فروشنده را احراز کنید.<br/>۲. وضعیت رهن، بازداشت و محدودیت ثبتی ملک را بررسی کنید.<br/>۳. مشخصات ملک، مبلغ، زمان تحویل و شروط قرارداد را دقیق بنویسید.<br/><br/>پرداخت بدون رسید و توافق مکتوب، ریسک اختلاف را بالا می‌برد.</div></foreignObject><text x="90" y="1740" fill="#d8bd7b" font-size="38" font-family="sans-serif">@amlakiman.1370</text></svg>
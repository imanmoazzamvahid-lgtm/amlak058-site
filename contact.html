<!doctype html>

<title>تماس با ما | املاک ۰۵۸</title>

<link rel="icon" href="/icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#20352a;font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
.wrap{width:min(760px,calc(100% - 28px));margin:24px auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 17px;background:#fff;border:1px solid #e1e9e3;border-radius:14px}
.brand{font-weight:900;color:#14583d}.back{color:#176344;font-size:13px;text-decoration:none}
.card{margin-top:18px;padding:28px;background:linear-gradient(145deg,#124b35,#1c684a);color:#fff;border-radius:20px;box-shadow:0 14px 36px #174b3518}
.kicker{font-size:12px;color:#d6e9dd}.card h1{font-size:25px;margin:5px 0 8px}.card>p{font-size:13px;color:#e0eee5;margin:0}
.contact{margin-top:22px;background:#fff;color:#20352a;border-radius:15px;padding:19px}
.contact small{display:block;color:#738078;font-size:11px}.phone{display:block;direction:ltr;text-align:right;font-size:24px;font-weight:900;color:#176344;text-decoration:none;margin:3px 0 15px}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a{flex:1;min-width:140px;text-align:center;text-decoration:none;border-radius:10px;padding:11px 14px;background:#176344;color:white;font-weight:800;font-size:13px}.actions a.secondary{background:#edf4ef;color:#176344;border:1px solid #dce8df}
.note{margin-top:18px;padding:15px;background:#fff;border:1px solid #e1e9e3;border-radius:13px;font-size:12px;color:#69766e}
@media(max-width:520px){.wrap{margin:12px auto}.card{padding:21px}.card h1{font-size:21px}.top{padding:12px}}
</style>
</head>
<body>
<main class="wrap">
 <header class="top"><a class="brand" href="/">املاک ۰۵۸</a><a class="back" href="/">بازگشت به صفحه اصلی ←</a></header>
 <section class="card">
  <span class="kicker">ویژه بجنورد و خراسان شمالی</span>
  <h1>تماس با ما</h1>
  <p>برای پیگیری آگهی‌ها، همکاری و ارتباط با مدیریت سامانه املاک ۰۵۸ از راه زیر با ما در تماس باشید.</p>
  <div class="contact">
   <small>تماس با مدیریت سایت</small>
   <a class="phone" href="tel:09152110616">09152110616</a>
   <div class="actions"><a href="tel:09152110616">تماس تلفنی</a><a class="secondary" href="/">بازگشت به سایت</a></div>
  </div>
 </section>
 <p class="note">املاک ۰۵۸ | بازار آنلاین خرید، فروش، رهن و اجاره ملک در بجنورد</p>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>املاک بجنورد | خرید، فروش، رهن و اجاره</title>
<meta name="description" content="سامانه رایگان ثبت و جستجوی آگهی املاک بجنورد و سراسر ایران">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Tahoma, Arial, sans-serif;
    background: #f5f5f3;
    color: #222;
}

header {
    background: #151515;
    color: white;
    padding: 15px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 15px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 45px;
    height: 45px;
    border: 2px solid #c9a45c;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c9a45c;
    font-size: 25px;
}

.logo-text strong {
    display: block;
    font-size: 22px;
}

.logo-text span {
    color: #c9a45c;
    font-size: 12px;
}

nav {
    display: flex;
    gap: 22px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.add-btn {
    background: #c9a45c;
    color: #111;
    border: 0;
    padding: 12px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
}

.hero {
    background: linear-gradient(135deg, #151515, #383126);
    padding: 70px 6% 80px;
    color: white;
    text-align: center;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 18px;
}

.hero h1 span {
    color: #d5b46a;
}

.hero p {
    color: #ddd;
    font-size: 16px;
    margin-bottom: 32px;
    line-height: 2;
}

.search-box {
    max-width: 1050px;
    margin: auto;
    background: white;
    padding: 12px;
    border-radius: 15px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1.3fr auto;
    gap: 9px;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-family: inherit;
    font-size: 13px;
    background: white;
}

.search-btn {
    background: #c9a45c;
    border: 0;
    border-radius: 9px;
    padding: 0 22px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.container {
    width: 88%;
    max-width: 1250px;
    margin: 45px auto;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
}

.section-title h2 {
    font-size: 24px;
}

.section-title span {
    color: #777;
    font-size: 13px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
}

.category {
    background: white;
    border-radius: 14px;
    padding: 23px 10px;
    text-align: center;
    box-shadow: 0 5px 18px #00000008;
    cursor: pointer;
    transition: .2s;
}

.category:hover {
    transform: translateY(-4px);
}

.category .icon {
    font-size: 32px;
    margin-bottom: 10px;
}

.category strong {
    display: block;
    margin-bottom: 8px;
}

.category small {
    color: #777;
}

.filter {
    background: white;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 23px;
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.filter button {
    border: 1px solid #ddd;
    background: white;
    padding: 10px 17px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
}

.filter button.active {
    background: #151515;
    color: white;
}

.properties {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 5px 18px #0000000a;
}

.card

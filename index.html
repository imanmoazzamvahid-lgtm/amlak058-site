/* بازطراحی ظاهری: چیدمان آگهی‌محور با الهام از سایت‌های نیازمندی */
:root{--primary:#a62626;--dark:#861f1f;--bg:#f7f7f7;--border:#e6e6e6;--text:#303030;--muted:#777}
body{background:#fff;color:#333;font-family:Tahoma,Arial,sans-serif;line-height:1.75}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e8e8e8;box-shadow:0 1px 3px #00000006}
.header-inner{min-height:66px;gap:22px}
.brand{gap:9px;flex-shrink:0}.brand-icon{width:38px;height:38px;border-radius:7px;background:var(--primary);font-size:25px}
.brand h1{font-size:17px;font-weight:700}.brand small{font-size:10px}
nav{gap:20px}nav a{font-size:12px;color:#444}nav a:hover{color:var(--primary)}
.btn{border-radius:5px;padding:9px 14px;font-size:13px}.btn-primary{background:var(--primary)}
.container{width:min(1240px,96%)}
.hero{margin-top:0;padding:25px 0 20px;background:#fff;border:0;border-radius:0}
.hero h2{font-size:21px;font-weight:700}.hero p{font-size:12px;margin:3px 0 14px}
.search-panel{border:1px solid #dedede;border-radius:5px;padding:8px;gap:8px;box-shadow:none;grid-template-columns:190px 190px minmax(180px,1fr) 95px}
input,select,textarea{border:1px solid #ddd;border-radius:4px;padding:10px;font-size:13px}input:focus,select:focus,textarea:focus{outline:1px solid var(--primary);border-color:var(--primary)}
.section{margin:20px auto}.section-heading{margin-bottom:12px}.section-heading h2{font-size:17px;font-weight:700}
#categories{margin-top:5px}#categories .categories{display:flex;gap:0;flex-wrap:wrap;border-top:1px solid #eee;border-bottom:1px solid #eee;padding:8px 0}
.category{border:0;border-radius:4px;background:transparent;padding:8px 17px;min-width:110px;transition:background .15s;box-shadow:none!important;transform:none!important}
.category:hover{background:#f8eeee;border-color:transparent}.category-icon{font-size:22px}.category strong{font-size:12px;font-weight:400}.category small{display:none}
#listings{margin-top:25px}#listings .section-heading{padding-bottom:10px;border-bottom:1px solid #eee}
.listing-tools{gap:6px;margin-bottom:10px}.filter-btn{border-radius:4px;padding:6px 12px;font-size:12px}.filter-btn.active{background:#f7eaea;color:var(--primary);border-color:#d8aaaa}
.advanced-filters{background:#fafafa;border:1px solid #eee;border-radius:5px;padding:10px;grid-template-columns:repeat(4,minmax(0,1fr)) 170px auto}
.property-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid #eee}
.property-card{display:flex;flex-direction:row-reverse;align-items:stretch;border:0;border-bottom:1px solid #e9e9e9;border-radius:0;padding:12px 4px;gap:13px;min-width:0;box-shadow:none!important;transform:none!important}
.property-image{width:150px;min-width:150px;height:125px;border-radius:4px;overflow:hidden;background:#f0f0f0;order:2}
.property-image img{min-width:100%;width:100%;height:100%;object-fit:cover}
.property-info{padding:0;flex:1;min-width:0;order:1;display:flex;flex-direction:column;align-items:flex-start}
.property-info h3{font-size:14px;font-weight:500;margin:2px 0 5px;line-height:1.8}
.property-type{font-size:10px;padding:1px 6px;border-radius:3px;background:#f8eeee;color:var(--primary)}
.property-address{font-size:11px;margin:0 0 5px;color:#777}
.property-details{font-size:11px;gap:8px;padding-bottom:6px;border-bottom:0;color:#777}
.property-price{color:#333;font-size:13px;margin:3px 0 5px;font-weight:700}
.property-description{font-size:11px;line-height:1.7;margin:3px 0;color:#666}
.property-actions{margin-top:auto;gap:5px}.property-actions .btn{padding:5px 8px;font-size:11px}.favorite-btn{font-size:11px;padding:5px 7px;margin:0;border-radius:4px}
.empty{border-radius:4px;font-size:13px;padding:30px 12px}
.about{border:0;border-top:1px solid #eee;border-radius:0;padding:18px 0;background:#fff}.about h2{font-size:16px}
footer{margin-top:25px;background:#fafafa;border-top:1px solid #eee;padding:20px 0}
.modal-box{border-radius:6px}.close-btn{border-radius:4px}
@media(max-width:850px){.container{width:94%}.search-panel{grid-template-columns:1fr 1fr}.advanced-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.property-grid{grid-template-columns:1fr 1fr}.property-image{width:125px;min-width:125px;height:112px}}
@media(max-width:560px){.header-inner{min-height:auto;gap:10px}.brand h1{font-size:15px}.header-inner>.btn{font-size:11px;padding:8px}.hero{padding:18px 0}.hero h2{font-size:18px}.search-panel{grid-template-columns:1fr 1fr}.search-panel input{grid-column:1/-1}.search-panel button{grid-column:1/-1}.category{min-width:0;flex:1 0 30%;padding:7px 4px}.category-icon{font-size:20px}.property-grid{grid-template-columns:1fr}.property-card{gap:10px;padding:11px 0}.property-image{width:112px;min-width:112px;height:105px}.property-info h3{font-size:13px}.property-actions .btn{font-size:10px}.advanced-filters{grid-template-columns:1fr 1fr}.site-note{font-size:11px}}


/* نوار پایین موبایل، ساده و الهام‌گرفته از نیازمندی‌ها */
.mobile-bottom-nav{display:none}
@media(max-width:650px){
 body{padding-bottom:74px}
 .mobile-bottom-nav{position:fixed;z-index:90;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;background:#fff;border-top:1px solid #e5e5e5;padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px #00000008}
 .mobile-nav-item{border:0;background:transparent;color:#555;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;line-height:1.5;min-width:0;padding:0 2px}
 .mobile-nav-icon{font-size:21px;line-height:1.2;min-height:24px}
 .mobile-nav-item.active{color:var(--primary)}
 .mobile-nav-item.post .mobile-nav-icon{display:grid;place-items:center;width:43px;height:37px;border-radius:7px;background:var(--primary);color:#fff;font-size:27px;font-weight:400;box-shadow:0 2px 5px #a6262630}
 .mobile-nav-item.post{font-weight:bold;color:var(--primary)}
 .header-inner nav{display:none}
 .header-inner{flex-wrap:nowrap}
 .brand small{display:none}
 .header-inner>.btn{font-size:11px;padding:8px 9px;white-space:nowrap}
}
.location-modal-box{max-width:440px}

#detailsModal{padding:0;background:#fff;overflow-y:auto;z-index:200}#detailsModal .details-box{max-width:none;width:100%;min-height:100vh;margin:0;padding:0;border-radius:0}#detailsModal .modal-header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;margin:0;padding:12px 3%;}#detailsContent{max-width:1100px;margin:22px auto;padding:0 18px}.details-gallery img{cursor:zoom-in}.details-content .detail-row{background:#fff;border-bottom:1px solid #eee;border-radius:0;padding:12px}.details-box .modal-header h2{font-size:16px} @media(max-width:600px){#detailsContent{padding:0 12px;margin:12px auto 80px}.details-gallery{grid-template-columns:1fr 1fr}.details-gallery img{max-height:190px}.details-content{grid-template-columns:1fr 1fr}}

.detail-contact-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 30px;padding:12px 0;border-top:1px solid #eee}.detail-contact-actions .btn{min-width:160px}.btn-chat{background:#e8f6ed;color:#176b39;border:1px solid #b9e3c7}.btn-chat:hover{background:#d8f0e1}


/* بازطراحی واقعی موبایل: چیدمان ساده و آگهی‌محور شبیه اپ‌های نیازمندی */
@media (max-width: 600px) {
  :root { --primary:#b51f2b; --bg:#fff; }
  html { scroll-padding-top: 76px; }
  body { background:#fff; padding-bottom:calc(76px + env(safe-area-inset-bottom)); line-height:1.75; }
  .container { width:100%; }
  header { position:sticky; top:0; border-bottom:1px solid #e8e8e8; box-shadow:0 2px 7px #00000006; }
  .header-inner { min-height:58px; padding:8px 14px; flex-wrap:nowrap; gap:8px; }
  .brand { gap:8px; min-width:0; }
  .brand-icon { width:35px; height:35px; min-width:35px; border-radius:8px; font-size:23px; }
  .brand h1 { font-size:15px; line-height:1.5; white-space:nowrap; }
  .brand small { font-size:9px; white-space:nowrap; }
  .header-inner>.btn { display:none; }
  header nav { display:none; }

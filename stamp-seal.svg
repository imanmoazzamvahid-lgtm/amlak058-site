<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">مهر اختصاصی املاک ۰۵۸</title>
<desc id="desc">مهر سپری مینیمال با عدد ۰۵۸ و نام املاک ۰۵۸، به رنگ سبز یشمی و نقره‌ای</desc>

 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".24" stop-color="#aebbb4"/><stop offset=".48" stop-color="#f7faf8"/><stop offset=".74" stop-color="#8c9d93"/><stop offset="1" stop-color="#eaf0ec"/></linearGradient>
 <linearGradient id="jade" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#39775c"/><stop offset=".48" stop-color="#174b3a"/><stop offset="1" stop-color="#092d22"/></linearGradient>
 <filter id="raised" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/><feOffset in="blur" dx="2" dy="3" result="offset"/><feFlood flood-color="#06261c" flood-opacity=".38" result="color"/><feComposite in="color" in2="offset" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

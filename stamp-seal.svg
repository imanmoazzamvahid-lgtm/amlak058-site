<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">مهر املاک ۰۵۸</title>
<desc id="desc">نشان دایره‌ای مینیمال املاک ۰۵۸ با جلوه برجسته سبز یشمی و نقره‌ای</desc>
<defs>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".32" stop-color="#aebbb4"/><stop offset=".56" stop-color="#f8fbf9"/><stop offset="1" stop-color="#899b91"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#34775a"/><stop offset=".52" stop-color="#174b3a"/><stop offset="1" stop-color="#092d22"/></linearGradient>
 <filter id="emboss" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/><feOffset in="b" dx="2" dy="2.5" result="o"/><feFlood flood-color="#08281e" flood-opacity=".42" result="c"/><feComposite in="c" in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<circle cx="256" cy="264" r="225" fill="#0b2d22" opacity=".16" filter="url(#shadow)"/>
<circle cx="256" cy="252" r="228" fill="#f9fbfa" stroke="url(#silver)" stroke-width="15"/>
<circle cx="256" cy="252" r="211" fill="none" stroke="url(#green)" stroke-width="6"/>
<circle cx="256" cy="252" r="194" fill="none" stroke="#aab8b0" stroke-width="1.5"/>
<circle cx="256" cy="252" r="181" fill="none" stroke="#d7e0db" stroke-width="1" stroke-dasharray="2 8"/>
<path d="M166 143H346" stroke="url(#silver)" stroke-width="3" stroke-linecap="round"/>
<circle cx="151" cy="143" r="4" fill="#174b3a"/><circle cx="361" cy="143" r="4" fill="#174b3a"/>
<text x="256" y="126" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="35" font-weight="800" fill="#174b3a">املاک</text>
<text x="256" y="307" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="145" font-weight="900" letter-spacing="2" fill="url(#green)" stroke="#e8efeb" stroke-width="2" paint-order="stroke" filter="url(#emboss)">۰۵۸</text>
<path d="M174 350H338" stroke="url(#silver)" stroke-width="3" stroke-linecap="round"/>
<path d="M256 365l8 11-8 11-8-11z" fill="url(#green)" filter="url(#emboss)"/>
<text x="256" y="423" text-anchor="middle" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#315b47">۰۵۸</text>
</svg>
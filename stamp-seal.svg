<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">مهر برجسته املاک ۰۵۸</title>
<desc id="desc">نشان دایره‌ای سبز با جلوه برجسته، ویژه رسید کمیسیون املاک ۰۵۸ بجنورد</desc>
<defs>
  <radialGradient id="paper" cx="32%" cy="22%" r="82%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".58" stop-color="#eef5f0"/>
    <stop offset="1" stop-color="#cbdacf"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fff9"/>
    <stop offset=".18" stop-color="#6e9a82"/>
    <stop offset=".38" stop-color="#173f31"/>
    <stop offset=".58" stop-color="#b5cfbd"/>
    <stop offset=".78" stop-color="#315d49"/>
    <stop offset="1" stop-color="#f8fff9"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#668b73"/>
    <stop offset=".48" stop-color="#174b3a"/>
    <stop offset="1" stop-color="#0c3026"/>
  </linearGradient>
  <filter id="relief" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
    <feOffset in="blur" dx="2" dy="3" result="darkOffset"/>
    <feComponentTransfer in="darkOffset" result="shadow">
      <feFuncA type="linear" slope=".42"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<!-- Soft paper shadow and raised outer rim -->
<circle cx="256" cy="260" r="239" fill="#0b2f24" opacity=".18" filter="url(#softShadow)"/>
<circle cx="256" cy="252" r="237" fill="url(#paper)" stroke="url(#metal)" stroke-width="17"/>
<circle cx="256" cy="252" r="220" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="3"/>
<circle cx="256" cy="252" r="208" fill="none" stroke="#214f3c" stroke-opacity=".7" stroke-width="5"/>
<circle cx="256" cy="252" r="195" fill="none" stroke="url(#metal)" stroke-width="3"/>
<circle cx="256" cy="252" r="184" fill="none" stroke="#6d927a" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 7"/>

<!-- Side ornaments -->
<g fill="url(#ink)" filter="url(#relief)">
  <path d="M79 252l12-7 12 7-12 7z"/>
  <path d="M409 252l12-7 12 7-12 7z"/>
  <circle cx="109" cy="252" r="4"/>
  <circle cx="403" cy="252" r="4"/>
</g>

<!-- Brand -->
<text x="256" y="142" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
      font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="43" font-weight="900"
      fill="url(#ink)" filter="url(#relief)">املاک ۰۵۸</text>
<path d="M151 160H361" stroke="#527761" stroke-width="2" stroke-linecap="round" opacity=".7"/>

<!-- Architectural mark -->
<g fill="none" stroke="url(#ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#relief)">
  <path d="M174 235L256 178L338 235"/>
  <path d="M193 231V291H319V231"/>
  <path d="M237 291V251Q237 242 246 242H266Q275 242 275 251V291"/>
  <path d="M210 250H222V263H210Z" fill="#dce9df" stroke-width="5"/>
  <path d="M290 250H302V263H290Z" fill="#dce9df" stroke-width="5"/>
</g>

<!-- Signature number -->
<text x="256" y="383" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
      font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="91" font-weight="900"
      letter-spacing="2" fill="url(#ink)" filter="url(#relief)">۰۵۸</text>
<path d="M145 399H367" stroke="#527761" stroke-width="2" stroke-linecap="round" opacity=".7"/>
<text x="256" y="438" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
      font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="27" font-weight="800"
      fill="#244e3b" filter="url(#relief)">بجنورد • از ۱۳۷۰</text>
<text x="256" y="472" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
      font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="17" font-weight="700"
      letter-spacing="1" fill="#527761">مهر تأیید رسید کمیسیون</text>
</svg>